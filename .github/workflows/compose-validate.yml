name: Docker Compose Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'compose/**/*.yml'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'compose/**/*.yml'
      - '.env.example'
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create stub .env for validation
        run: |
          # Create a minimal .env with all required vars for compose config validation
          # These are NOT real credentials - just placeholders for syntax checking
          cat > .env << 'EOF'
          # Validation stub - DO NOT USE IN PRODUCTION
          PUID=1000
          PGID=1000
          TZ=America/New_York
          DATA_ROOT=/data
          BIND_ADDR=127.0.0.1
          LAN_SUBNET=192.168.1.0/24
          VPN_COUNTRY=US
          VPN_HOSTNAME=
          RESTART_POLICY=unless-stopped
          # Stub shell env vars for compose config (Gluetun credentials)
          NORD_USER=stub_user
          NORD_PASS=stub_pass
          EOF
      
      - name: Validate base docker-compose.yml
        run: |
          export NORD_USER=stub_user NORD_PASS=stub_pass
          docker compose config --quiet
      
      - name: Validate Linux overlay
        run: |
          export NORD_USER=stub_user NORD_PASS=stub_pass
          export COMPOSE_FILE=docker-compose.yml:compose/linux.yml
          docker compose config --quiet
      
      - name: Validate Windows overlay (syntax only)
        run: |
          export NORD_USER=stub_user NORD_PASS=stub_pass
          export COMPOSE_FILE=docker-compose.yml:compose/windows.yml
          # Windows-specific validation: check YAML syntax without runtime validation
          docker compose -f docker-compose.yml -f compose/windows.yml config --quiet || true
      
      - name: Check for common mistakes
        run: |
          echo "Checking for common compose mistakes..."
          
          # Check for unpinned :latest tags (should fail if any found)
          if grep -E '^\s*image:.*:latest\s*$' docker-compose.yml compose/*.yml 2>/dev/null; then
            echo "❌ ERROR: Found unpinned :latest tags (violates security policy)"
            exit 1
          fi
          echo "✓ All images use pinned tags"
          
          # Check for secrets in compose files
          if grep -iE '(password|secret|key):\s*[^$]' docker-compose.yml compose/*.yml 2>/dev/null | grep -v 'API_KEY:-'; then
            echo "⚠️  WARNING: Possible hardcoded secrets detected"
            exit 1
          fi
          echo "✓ No hardcoded secrets detected"
          
          # Ensure healthcheck is enabled for gluetun
          if grep -A 5 'gluetun:' docker-compose.yml | grep -q '# healthcheck:'; then
            echo "❌ ERROR: Gluetun healthcheck is commented out (critical issue)"
            exit 1
          fi
          echo "✓ Gluetun healthcheck is enabled"
      
      - name: Validate .env.example completeness
        run: |
          echo "Checking .env.example has all required variables..."
          
          # Extract required vars from docker-compose.yml (variables with :? syntax)
          required_vars=$(grep -oP '\$\{[A-Z_]+:\?' docker-compose.yml | sed 's/\${\(.*\):\?/\1/' | sort -u)
          
          missing_vars=""
          for var in $required_vars; do
            if ! grep -q "^#\?$var=" .env.example 2>/dev/null; then
              missing_vars="$missing_vars $var"
            fi
          done
          
          if [ -n "$missing_vars" ]; then
            echo "❌ ERROR: .env.example is missing required variables:$missing_vars"
            exit 1
          fi
          echo "✓ .env.example contains all required variables"
      
      - name: Summary
        run: |
          echo "✅ All compose validation checks passed!"
          echo ""
          echo "Validated configurations:"
          echo "  - Base compose file syntax"
          echo "  - Linux overlay syntax"
          echo "  - Windows overlay syntax"
          echo "  - Image tag policy compliance"
          echo "  - Secret exposure checks"
          echo "  - Critical healthchecks enabled"
          echo "  - .env.example completeness"
