services:
  # Docker Desktop cannot provide a reliable host-network Tailscale node on
  # Windows. This userspace node is optional and joins only the media bridge.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-media-dev-windows}
    profiles:
      - tailscale
    networks:
      - medianet
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?Set TS_AUTHKEY in your shell environment, not in .env}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_ACCEPT_DNS=false
      - TS_EXTRA_ARGS=--accept-routes --advertise-tags=tag:media-dev
    volumes:
      - ./config/tailscale-windows:/var/lib/tailscale
    restart: ${RESTART_POLICY:?Set RESTART_POLICY in .env}

  gluetun:
    environment:
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:?Set LAN_SUBNET in .env},100.64.0.0/10
